name: Track + Build site

on:
  schedule:
    - cron: "0 11 * * *"   # 6am ET / 11am UTC, daily
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - id: run
        run: |
          python house_tracker.py  | tee -a run.log
          python senate_tracker.py | tee -a run.log
          python f13_tracker.py    | tee -a run.log
          python build_site.py     | tee -a run.log

      - name: Commit data and rebuilt site
        run: |
          git config user.name  "tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ docs/
          git diff --quiet --staged || git commit -m "Auto: snapshot $(date -u +%F)"
          git push
